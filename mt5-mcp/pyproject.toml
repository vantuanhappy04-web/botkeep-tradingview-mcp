[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "metatrader-mcp-server"
version = "0.5.1"
description = "Model Context Protocol (MCP) server built with Python to enable AI LLMs to trade using MetaTrader platform."
requires-python = ">=3.10"
license = { file="LICENSE" }
dependencies = [
  "python-dotenv>=1.0.0",
  "MetaTrader5>=5.0.45",
  "numpy>=1.26.0",
  "pandas>=2.0.0",
  "tabulate>=0.9.0",
  "pydantic>=2.0.0",
  "mcp>=1.6.0,<2.0.0",
  "click>=8.0.0",
  "pytz",
]

[tool.setuptools.packages.find]
where = ["src"]
include = ["metatrader_mcp*", "metatrader_client*"]

[project.scripts]
"metatrader-mcp-server" = "metatrader_mcp.cli:main"
